<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom,#0c94ca, #a6bcc1);
        }
        .content {
            width: 25%;
        }
        #pw {
            outline: 0;
            border: 0;
            border-radius: 5px;
        }
        #bar {
            height: 10px;
            width: 0;
            border-radius: 5px;
            transition: width .2s;
            margin-top: 20px;
        }

        #bar[data-level="none"] {
            width: 0;
        }

        #bar[data-level="weak"] {
            width: 25%;
            background: #e53935;
        }

        #bar[data-level="fair"] {
            width: 50%;
            background: #fb8c00;
        }

        #bar[data-level="good"] {
            width: 75%;
            background: #fdd835;
        }

        #bar[data-level="strong"] {
            width: 100%;
            background: #43a047;
        }

        .met {
            color: green;
        }
        #toggle {
            border-radius: 12px;
            padding: 3px 8px;
            color: #fff;
            background-color: rgb(6, 98, 160);
            outline: 0;
            border: 0;
            font-size: 12px;
        }

    </style>
</head>

<body>
    <div class="cont">
        <h1>Password Checker</h1>
        <div class="content">
            <input id="pw" type="password"> <button id="toggle">Show</button>
            <div id="bar" data-level="none"></div>
            <p id="label"></p>
            <ul id="checks"></ul>
        </div>
        <script src="assets/app.js"></script>
    </div>
</body>

</html>
