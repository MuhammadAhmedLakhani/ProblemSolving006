<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #bar {
            height: 10px;
            width: 0;
            border-radius: 5px;
            transition: width .2s;
        }

        #bar[data-level="none"] {
            width: 0;
        }

        #bar[data-level="weak"] {
            width: 25%;
            background: #e53935;
        }

        #bar[data-level="fair"] {
            width: 50%;
            background: #fb8c00;
        }

        #bar[data-level="good"] {
            width: 75%;
            background: #fdd835;
        }

        #bar[data-level="strong"] {
            width: 100%;
            background: #43a047;
        }

        .met {
            color: green;
        }
    </style>
</head>

<body>
    <input id="pw" type="password"> <button id="toggle">Show</button>
    <div id="bar" data-level="none"></div>
    <p id="label"></p>
    <ul id="checks"></ul>
    <script src="assets/app.js"></script>
</body>

</html>
